name: Build & Deploy ZelosHR Backend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "app/**"
      - "tests/**"
      - "func/**"
      - "scripts/ci/**"
      - "nuget.config"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_container_app:
        description: Deploy Container App (API image)
        type: boolean
        default: true
      deploy_functions:
        description: Deploy Azure Functions (requires Function App in Azure)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: read

env:
  SERVICE_NAME: zeloshr
  DOCKERFILE_PATH: app/Dockerfile
  BUILD_CONTEXT: .

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.changes.outputs.app }}
      func_changed: ${{ steps.changes.outputs.func }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'app/**'
              - 'tests/**'
              - 'scripts/ci/**'
              - 'nuget.config'
              - '.github/workflows/build-and-deploy.yml'
            func:
              - 'func/**'

  build-and-deploy-app:
    name: Build & Deploy Container App
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_container_app)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "acr_name=${{ vars.PROD_CONTAINER_REGISTRY_NAME }}" >> "$GITHUB_OUTPUT"
            echo "subscription_id=${{ secrets.TROVESUITE_PROD_AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_OUTPUT"
            echo "container_app_name=trovesuite-prod-zeloshr-ca" >> "$GITHUB_OUTPUT"
            echo "resource_group=${{ vars.PROD_RESOURCE_GROUP }}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "acr_name=${{ vars.DEV_CONTAINER_REGISTRY_NAME }}" >> "$GITHUB_OUTPUT"
            echo "subscription_id=${{ secrets.TROVESUITE_DEV_AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_OUTPUT"
            echo "container_app_name=trovesuite-dev-zeloshr-ca" >> "$GITHUB_OUTPUT"
            echo "resource_group=${{ vars.DEV_RESOURCE_GROUP }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity-check OIDC inputs
        env:
          CID: ${{ secrets.TROVESUITE_AZURE_CLIENT_ID }}
          TID: ${{ secrets.AZURE_TENANT_ID }}
          SID: ${{ steps.env.outputs.subscription_id }}
          PKG: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          echo "branch          = ${{ github.ref_name }}"
          echo "env             = ${{ steps.env.outputs.env }}"
          echo "container_app   = ${{ steps.env.outputs.container_app_name }}"
          echo "client-id       length=${#CID}"
          echo "tenant-id       length=${#TID}"
          echo "subscription-id length=${#SID}"
          echo "packages-token  length=${#PKG}"
          [[ -z "$CID" ]] && echo "::error::client-id is empty (TROVESUITE_AZURE_CLIENT_ID)" && exit 1
          [[ -z "$TID" ]] && echo "::error::tenant-id is empty (AZURE_TENANT_ID)" && exit 1
          [[ -z "$SID" ]] && echo "::error::subscription-id is empty (TROVESUITE_*_AZURE_SUBSCRIPTION_ID)" && exit 1
          [[ -z "$PKG" ]] && echo "::error::PACKAGES_TOKEN is empty (org secret — PAT with read:packages for Trovesuite.Package)" && exit 1
          echo "PACKAGES_TOKEN=$PKG" >> "$GITHUB_ENV"
          echo "All required deploy inputs are present."

      - name: OIDC subject (must exist in Azure App Registration)
        run: |
          echo "GitHub federated identity subject for this run:"
          echo "  repo:${{ github.repository }}:ref:refs/heads/${{ github.ref_name }}"
          echo "If Azure Login fails with AADSTS700213, add this subject under"
          echo "TROVESUITE_AZURE_CLIENT_ID → Federated credentials (same app as Core Platform)."
          echo "See docs/CICD.md#azure-oidc-federated-credentials"

      # TEMPORARY: remove after OIDC/credential debugging (secrets are masked in Actions logs).
      - name: Debug secrets and vars (temporary — container app)
        env:
          TROVESUITE_AZURE_CLIENT_ID: ${{ secrets.TROVESUITE_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TROVESUITE_PROD_AZURE_SUBSCRIPTION_ID: ${{ secrets.TROVESUITE_PROD_AZURE_SUBSCRIPTION_ID }}
          TROVESUITE_DEV_AZURE_SUBSCRIPTION_ID: ${{ secrets.TROVESUITE_DEV_AZURE_SUBSCRIPTION_ID }}
          TROVESUITE_SHARED_AZURE_SUBSCRIPTION_ID: ${{ secrets.TROVESUITE_SHARED_AZURE_SUBSCRIPTION_ID }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== GitHub context ==="
          echo "ref_name=${{ github.ref_name }}"
          echo "repository=${{ github.repository }}"
          echo "workflow=${{ github.workflow }}"
          echo "run_id=${{ github.run_id }}"
          echo ""
          echo "=== Repository variables (vars.*) ==="
          echo "PROD_CONTAINER_REGISTRY_NAME=${{ vars.PROD_CONTAINER_REGISTRY_NAME }}"
          echo "DEV_CONTAINER_REGISTRY_NAME=${{ vars.DEV_CONTAINER_REGISTRY_NAME }}"
          echo "PROD_RESOURCE_GROUP=${{ vars.PROD_RESOURCE_GROUP }}"
          echo "DEV_RESOURCE_GROUP=${{ vars.DEV_RESOURCE_GROUP }}"
          echo ""
          echo "=== Step outputs (env job) ==="
          echo "env=${{ steps.env.outputs.env }}"
          echo "acr_name=${{ steps.env.outputs.acr_name }}"
          echo "container_app_name=${{ steps.env.outputs.container_app_name }}"
          echo "resource_group=${{ steps.env.outputs.resource_group }}"
          echo "subscription_id(step)=${{ steps.env.outputs.subscription_id }}"
          echo ""
          echo "=== Secrets (values masked by GitHub if non-empty) ==="
          for name in TROVESUITE_AZURE_CLIENT_ID AZURE_TENANT_ID TROVESUITE_PROD_AZURE_SUBSCRIPTION_ID TROVESUITE_DEV_AZURE_SUBSCRIPTION_ID TROVESUITE_SHARED_AZURE_SUBSCRIPTION_ID PACKAGES_TOKEN; do
            val="${!name-}"
            if [[ -z "$val" ]]; then
              echo "${name}=<empty>"
            else
              echo "${name}=<set len=${#val}> value=${val}"
            fi
          done

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TROVESUITE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.env.outputs.subscription_id }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ steps.env.outputs.acr_name }}

      - name: Verify Container App exists in Azure
        id: containerapp
        run: |
          NAME="${{ steps.env.outputs.container_app_name }}"
          RG="${{ steps.env.outputs.resource_group }}"
          if az containerapp show --name "$NAME" --resource-group "$RG" --query id -o tsv 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Container App $NAME found in $RG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Container App deploy — $NAME does not exist in $RG."
            echo "Create the Container App in Azure (same pattern as trovesuite-dev-mystoreguard-ca), then re-run the workflow."
            echo "Image will still be pushed to ACR as zeloshr:${{ github.run_number }}."
          fi

      - name: Build and push Docker image
        id: build
        run: |
          ACR_LOGIN_SERVER="${{ steps.env.outputs.acr_name }}.azurecr.io"
          IMAGE_TAG="${{ github.run_number }}"

          docker build \
            --build-arg PACKAGES_TOKEN="$PACKAGES_TOKEN" \
            --build-arg BUILD_VERSION="${{ github.sha }}" \
            -t "${ACR_LOGIN_SERVER}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}" \
            -t "${ACR_LOGIN_SERVER}/${{ env.SERVICE_NAME }}:latest" \
            -f "${{ env.DOCKERFILE_PATH }}" \
            "${{ env.BUILD_CONTEXT }}"

          docker push "${ACR_LOGIN_SERVER}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}"
          docker push "${ACR_LOGIN_SERVER}/${{ env.SERVICE_NAME }}:latest"

          echo "image=${ACR_LOGIN_SERVER}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Sync SECRET_KEY to Container App
        if: steps.containerapp.outputs.exists == 'true'
        env:
          JWT_SECRET: ${{ secrets.TROVESUITE_SECRET_KEY }}
        run: |
          if [[ -z "${JWT_SECRET}" ]]; then
            echo "::warning::TROVESUITE_SECRET_KEY is not set — configure SECRET_KEY manually on the Container App (see docs/PRODUCTION_CONFIG.md)."
            exit 0
          fi
          NAME="${{ steps.env.outputs.container_app_name }}"
          RG="${{ steps.env.outputs.resource_group }}"
          az containerapp secret set \
            --name "$NAME" \
            --resource-group "$RG" \
            --secrets "jwt-secret-key=${JWT_SECRET}" \
            --output none
          az containerapp update \
            --name "$NAME" \
            --resource-group "$RG" \
            --set-env-vars "SECRET_KEY=secretref:jwt-secret-key" \
            --output none
          echo "SECRET_KEY synced from TROVESUITE_SECRET_KEY."

      - name: Deploy to Azure Container Apps
        if: steps.containerapp.outputs.exists == 'true'
        run: |
          az containerapp update \
            --name "${{ steps.env.outputs.container_app_name }}" \
            --resource-group "${{ steps.env.outputs.resource_group }}" \
            --image "${{ steps.build.outputs.image }}"

    outputs:
      container_app_deployed: ${{ steps.containerapp.outputs.exists == 'true' }}
      deploy_env: ${{ steps.env.outputs.env }}

  post-deploy-regression:
    name: Post-deploy regression tests
    needs: build-and-deploy-app
    if: needs.build-and-deploy-app.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Run regression suite (Docker Compose)
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          chmod +x scripts/ci/regression-test.sh scripts/compose.sh scripts/compose/*.sh
          ./scripts/ci/regression-test.sh

  post-deploy-leave-e2e:
    name: Leave E2E (Hurl)
    needs: [build-and-deploy-app, post-deploy-regression]
    if: |
      needs.build-and-deploy-app.result == 'success' &&
      needs.post-deploy-regression.result == 'success' &&
      github.ref_name == 'dev' &&
      needs.build-and-deploy-app.outputs.container_app_deployed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check Leave E2E configuration
        id: e2e_cfg
        env:
          TROVESUITE_SECRET_KEY: ${{ secrets.TROVESUITE_SECRET_KEY }}
          ZELOSHR_E2E_ORG_ID: ${{ secrets.ZELOSHR_E2E_ORG_ID }}
          ZELOSHR_E2E_USER_ID: ${{ secrets.ZELOSHR_E2E_USER_ID }}
        run: |
          if [[ -z "${TROVESUITE_SECRET_KEY}" || -z "${ZELOSHR_E2E_ORG_ID}" || -z "${ZELOSHR_E2E_USER_ID}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Leave E2E skipped — configure ZELOSHR_E2E_* secrets (docs/CICD.md#leave-e2e-hurl)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Hurl
        if: steps.e2e_cfg.outputs.configured == 'true'
        run: |
          HURL_VERSION="6.0.0"
          curl -sSL "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          sudo mv "/tmp/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin/hurl" /usr/local/bin/hurl
          hurl --version

      - name: Run Leave E2E against deployed dev API
        if: steps.e2e_cfg.outputs.configured == 'true'
        env:
          CI: "true"
          TROVESUITE_SECRET_KEY: ${{ secrets.TROVESUITE_SECRET_KEY }}
          ZELOSHR_E2E_USER_ID: ${{ secrets.ZELOSHR_E2E_USER_ID }}
          ZELOSHR_E2E_TENANT_ID: ${{ secrets.ZELOSHR_E2E_TENANT_ID }}
          ZELOSHR_E2E_ORG_ID: ${{ secrets.ZELOSHR_E2E_ORG_ID }}
          ZELOSHR_E2E_BUS_ID: ${{ secrets.ZELOSHR_E2E_BUS_ID }}
          ZELOSHR_E2E_LOC_ID: ${{ secrets.ZELOSHR_E2E_LOC_ID }}
          ZELOSHR_E2E_EMAIL: ${{ secrets.ZELOSHR_E2E_EMAIL }}
          ZELOSHR_E2E_FULLNAME: ${{ secrets.ZELOSHR_E2E_FULLNAME }}
          ZELOSHR_API_BASE: https://zeloshr.app.backend.dev.trovesuite.com
        run: |
          chmod +x scripts/ci/leave-e2e.sh scripts/ci/mint-e2e-session.sh scripts/local-dev/test-leave-e2e.sh
          ./scripts/ci/leave-e2e.sh

      - name: Upload Leave E2E report
        if: steps.e2e_cfg.outputs.configured == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: leave-e2e-report
          path: |
            reports/e2e/leave/latest/html/
            reports/e2e/leave/latest/junit.xml
            reports/e2e/leave/latest/summary.txt
          retention-days: 14
          if-no-files-found: warn

  deploy-functions:
    name: Deploy Azure Functions
    needs: detect-changes
    if: needs.detect-changes.outputs.func_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_functions)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "subscription_id=${{ secrets.TROVESUITE_PROD_AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_OUTPUT"
            echo "function_app_name=trovesuite-prod-zeloshr-func" >> "$GITHUB_OUTPUT"
            echo "resource_group=${{ vars.PROD_RESOURCE_GROUP }}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "subscription_id=${{ secrets.TROVESUITE_DEV_AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_OUTPUT"
            echo "function_app_name=trovesuite-dev-zeloshr-func" >> "$GITHUB_OUTPUT"
            echo "resource_group=${{ vars.DEV_RESOURCE_GROUP }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity-check OIDC inputs
        env:
          CID: ${{ secrets.TROVESUITE_AZURE_CLIENT_ID }}
          TID: ${{ secrets.AZURE_TENANT_ID }}
          SID: ${{ steps.env.outputs.subscription_id }}
        run: |
          echo "branch          = ${{ github.ref_name }}"
          echo "env             = ${{ steps.env.outputs.env }}"
          echo "function_app    = ${{ steps.env.outputs.function_app_name }}"
          echo "client-id       length=${#CID}"
          echo "tenant-id       length=${#TID}"
          echo "subscription-id length=${#SID}"
          [[ -z "$CID" ]] && echo "::error::client-id is empty (TROVESUITE_AZURE_CLIENT_ID)" && exit 1
          [[ -z "$TID" ]] && echo "::error::tenant-id is empty (AZURE_TENANT_ID)" && exit 1
          [[ -z "$SID" ]] && echo "::error::subscription-id is empty (TROVESUITE_*_AZURE_SUBSCRIPTION_ID)" && exit 1
          echo "All three OIDC inputs are present."

      - name: OIDC subject (must exist in Azure App Registration)
        run: |
          echo "GitHub federated identity subject for this run:"
          echo "  repo:${{ github.repository }}:ref:refs/heads/${{ github.ref_name }}"
          echo "See docs/CICD.md#azure-oidc-federated-credentials"

      # TEMPORARY: remove after OIDC/credential debugging (secrets are masked in Actions logs).
      - name: Debug secrets and vars (temporary — functions)
        env:
          TROVESUITE_AZURE_CLIENT_ID: ${{ secrets.TROVESUITE_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TROVESUITE_PROD_AZURE_SUBSCRIPTION_ID: ${{ secrets.TROVESUITE_PROD_AZURE_SUBSCRIPTION_ID }}
          TROVESUITE_DEV_AZURE_SUBSCRIPTION_ID: ${{ secrets.TROVESUITE_DEV_AZURE_SUBSCRIPTION_ID }}
          TROVESUITE_SHARED_AZURE_SUBSCRIPTION_ID: ${{ secrets.TROVESUITE_SHARED_AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          echo "=== GitHub context ==="
          echo "ref_name=${{ github.ref_name }}"
          echo "repository=${{ github.repository }}"
          echo ""
          echo "=== Repository variables (vars.*) ==="
          echo "PROD_RESOURCE_GROUP=${{ vars.PROD_RESOURCE_GROUP }}"
          echo "DEV_RESOURCE_GROUP=${{ vars.DEV_RESOURCE_GROUP }}"
          echo ""
          echo "=== Step outputs (env job) ==="
          echo "env=${{ steps.env.outputs.env }}"
          echo "function_app_name=${{ steps.env.outputs.function_app_name }}"
          echo "resource_group=${{ steps.env.outputs.resource_group }}"
          echo "subscription_id(step)=${{ steps.env.outputs.subscription_id }}"
          echo ""
          echo "=== Secrets (values masked by GitHub if non-empty) ==="
          for name in TROVESUITE_AZURE_CLIENT_ID AZURE_TENANT_ID TROVESUITE_PROD_AZURE_SUBSCRIPTION_ID TROVESUITE_DEV_AZURE_SUBSCRIPTION_ID TROVESUITE_SHARED_AZURE_SUBSCRIPTION_ID; do
            val="${!name-}"
            if [[ -z "$val" ]]; then
              echo "${name}=<empty>"
            else
              echo "${name}=<set len=${#val}> value=${val}"
            fi
          done

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TROVESUITE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.env.outputs.subscription_id }}

      - name: Verify Function App exists in Azure
        id: funcapp
        run: |
          NAME="${{ steps.env.outputs.function_app_name }}"
          RG="${{ steps.env.outputs.resource_group }}"
          if az functionapp show --name "$NAME" --resource-group "$RG" --query id -o tsv 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Function App $NAME found in $RG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Functions deploy — $NAME does not exist in $RG."
            echo "Create the Function App in Azure, then re-run with func/** changes or workflow_dispatch + deploy_functions."
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.funcapp.outputs.exists == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Publish Functions (.NET isolated)
        if: steps.funcapp.outputs.exists == 'true'
        run: |
          dotnet restore func/ZelosHR.Functions.csproj
          dotnet publish func/ZelosHR.Functions.csproj -c Release -o ./func-publish

      - name: Deploy Azure Functions
        if: steps.funcapp.outputs.exists == 'true'
        uses: azure/functions-action@v1
        with:
          app-name: ${{ steps.env.outputs.function_app_name }}
          package: func-publish
