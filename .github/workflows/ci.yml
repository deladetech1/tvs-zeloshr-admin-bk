name: CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches-ignore: [main, dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require GitHub Packages token
        env:
          PKG: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [[ -z "$PKG" ]]; then
            echo "::error::Repository secret PACKAGES_TOKEN is required (PAT with read:packages for Trovesuite.Package). See docs/CICD.md"
            exit 1
          fi
          printf 'PACKAGES_TOKEN=%s\n' "$PKG" >> app/.env

      - name: Unit tests (Docker Compose)
        run: |
          chmod +x scripts/compose.sh scripts/compose/*.sh
          ./scripts/compose.sh test

      - name: Docker build (API)
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          docker build \
            --build-arg PACKAGES_TOKEN="$PACKAGES_TOKEN" \
            -f app/Dockerfile \
            .
