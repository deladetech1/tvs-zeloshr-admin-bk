name: CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure GitHub Packages auth
        env:
          PAT: ${{ secrets.PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$GITHUB_TOKEN" ]]; then
            echo "Using GITHUB_TOKEN for Trovesuite.Package restore (packages: read)."
            printf 'PACKAGES_TOKEN=%s\n' "$GITHUB_TOKEN" >> app/.env
          elif [[ -n "$PAT" ]]; then
            echo "Using PACKAGES_TOKEN for Trovesuite.Package restore."
            printf 'PACKAGES_TOKEN=%s\n' "$PAT" >> app/.env
          else
            echo "::error::No GitHub Packages credential — ensure packages: read on GITHUB_TOKEN or set PACKAGES_TOKEN. See docs/CICD.md"
            exit 1
          fi

      - name: Unit tests (Docker Compose)
        run: |
          chmod +x scripts/compose.sh scripts/compose/*.sh
          ./scripts/compose.sh test

      - name: Docker build (API)
        env:
          PAT: ${{ secrets.PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${GITHUB_TOKEN:-$PAT}"
          docker build \
            --build-arg PACKAGES_TOKEN="$TOKEN" \
            -f app/Dockerfile \
            .
