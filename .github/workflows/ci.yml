name: CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - ".github/workflows/ci.yml"
  push:
    branches-ignore: [main, dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Require GitHub Packages token
        env:
          PKG: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
        run: |
          if [[ -z "$PKG" ]]; then
            echo "::error::Repository secret GITHUB_PACKAGES_TOKEN is required (PAT with read:packages for Trovesuite.Package). See docs/CICD.md"
            exit 1
          fi
          dotnet nuget update source github-deladetech1 \
            --username deladetech1 \
            --password "$PKG" \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: dotnet restore and test
        run: |
          dotnet restore tests/ZelosHR.Api.Tests/ZelosHR.Api.Tests.csproj
          dotnet test tests/ZelosHR.Api.Tests/ZelosHR.Api.Tests.csproj -c Release --no-restore

      - name: Docker build (API)
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
        run: |
          docker build \
            --build-arg GITHUB_PACKAGES_TOKEN="$GITHUB_PACKAGES_TOKEN" \
            -f app/Dockerfile \
            .
