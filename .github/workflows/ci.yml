name: CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - ".github/workflows/ci.yml"
  push:
    branches-ignore: [main, dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Configure GitHub Packages NuGet source
        env:
          PKG: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
        run: |
          TOKEN="${PKG:-${{ secrets.GITHUB_TOKEN }}}"
          if [[ -z "$TOKEN" ]]; then
            echo "::error::Set repository secret GITHUB_PACKAGES_TOKEN (read:packages PAT) or ensure GITHUB_TOKEN can read org packages"
            exit 1
          fi
          if [[ -z "$PKG" ]]; then
            echo "::warning::GITHUB_PACKAGES_TOKEN not set; using GITHUB_TOKEN for NuGet restore"
          fi
          dotnet nuget update source github-deladetech1 \
            --username deladetech1 \
            --password "$TOKEN" \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: dotnet restore and test
        run: |
          dotnet restore tests/ZelosHR.Api.Tests/ZelosHR.Api.Tests.csproj
          dotnet test tests/ZelosHR.Api.Tests/ZelosHR.Api.Tests.csproj -c Release --no-restore

      - name: Docker build (API)
        env:
          PKG: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
        run: |
          TOKEN="${PKG:-${{ secrets.GITHUB_TOKEN }}}"
          docker build \
            --build-arg GITHUB_PACKAGES_TOKEN="$TOKEN" \
            -f app/Dockerfile \
            .
