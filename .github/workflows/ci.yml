name: CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "tests/**"
      - "nuget.config"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require GitHub Packages token
        id: pkg
        env:
          PKG: ${{ secrets.PACKAGES_TOKEN }}
          FALLBACK: ${{ github.token }}
        run: |
          TOKEN="${PKG:-}"
          if [[ -z "$TOKEN" ]]; then
            echo "::warning::PACKAGES_TOKEN secret empty — falling back to GITHUB_TOKEN (packages:read)"
            TOKEN="${FALLBACK}"
          fi
          if [[ -z "$TOKEN" ]]; then
            echo "::error::No token available for GitHub Packages (set PACKAGES_TOKEN or enable packages:read)."
            exit 1
          fi
          # Single-key .env for Compose (avoid duplicate/empty PACKAGES_TOKEN= lines).
          printf 'PACKAGES_TOKEN=%s\n' "$TOKEN" > app/.env
          echo "token_len=${#TOKEN}" >> "$GITHUB_STEP_SUMMARY"
          # Expose for subsequent steps / compose interpolation (masked by Actions).
          echo "PACKAGES_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Unit tests (Docker Compose)
        env:
          PACKAGES_TOKEN: ${{ env.PACKAGES_TOKEN }}
        run: |
          chmod +x scripts/compose.sh scripts/compose/*.sh
          ./scripts/compose.sh test

      - name: Docker build (API)
        env:
          PACKAGES_TOKEN: ${{ env.PACKAGES_TOKEN }}
        run: |
          docker build \
            --build-arg PACKAGES_TOKEN="$PACKAGES_TOKEN" \
            -f app/Dockerfile \
            .
