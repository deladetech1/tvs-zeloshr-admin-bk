# ZelosHR local stack — use ./scripts/compose.sh (see docs/LOCAL_DEV.md).
# Loads secrets from app/.env (PACKAGES_TOKEN, DB_*, etc.).
#
# Typical flow:
#   ./scripts/compose.sh test      # unit tests (no DB)
#   ./scripts/compose.sh dev       # db + tvs-sqlscript migrate + API
#   ./scripts/compose.sh reset     # wipe volume, migrate, API

name: zeloshr

services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - app/.env
    ports:
      - "${DB_PORT:-5431}:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-zeloshrdb}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-zeloshrdb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # One-shot: EF migrations + Sql/Seeds from sibling tvs-sqlscript (source of truth).
  migrate:
    profiles: [tools]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /sqlscript
    env_file:
      - app/.env
    environment:
      TVS_DB_HOST: db
      TVS_DB_PORT: "5432"
      TVS_SQLSCRIPT_ROOT: /sqlscript
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ${TVS_SQLSCRIPT_PATH:-../tvs-sqlscript}:/sqlscript
      - ./scripts/compose/migrate-entrypoint.sh:/migrate-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/migrate-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy

  # One-shot: unit tests (mocked repositories; no database).
  test:
    profiles: [tools]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    env_file:
      - app/.env
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - .:/src
      - dotnet_nuget:/root/.nuget/packages
      - ./scripts/compose/test-entrypoint.sh:/test-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/test-entrypoint.sh"]

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        PACKAGES_TOKEN: ${PACKAGES_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - app/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      TrovesuiteIntegration__RequireAuthentication: ${TROVESUITE_REQUIRE_AUTH:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgresql_data:
  redis_data:
  dotnet_nuget:
